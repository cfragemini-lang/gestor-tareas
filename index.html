<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SortableJS for Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <!-- Chart.js for Dashboard Metrics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="login-screen">
        <div class="login-content">
            <h1>Gestor de Tareas</h1>
            <p>Gestión de casos y tareas judiciales.</p>
            <button id="btn-login" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="20">
                Iniciar sesión con Google
            </button>
        </div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <h1><i class="fa-solid fa-briefcase"></i> Gestor de Tareas</h1>
            <div style="display: flex; align-items: center;">
                <div id="user-info" class="user-info" style="display: none;">
                    <img src="" alt="User" class="user-avatar">
                    <span class="user-name">Usuario</span>
                    <button id="btn-logout" title="Cerrar sesión"><i
                            class="fa-solid fa-right-from-bracket"></i></button>
                </div>
                <button id="theme-toggle" class="btn-icon"><i class="fa-solid fa-moon"></i></button>
            </div>
        </header>


        <!-- Dashboard de Métricas -->
        <div class="dashboard-metrics">
            <div class="metric-card">
                <div class="metric-icon" style="background: rgba(245, 158, 11, 0.2);">
                    <i class="fa-solid fa-clock" style="color: #f59e0b;"></i>
                </div>
                <div class="metric-info">
                    <span class="metric-label">Pendientes</span>
                    <span class="metric-value" id="metric-pending">0</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon" style="background: rgba(99, 102, 241, 0.2);">
                    <i class="fa-solid fa-spinner" style="color: #6366f1;"></i>
                </div>
                <div class="metric-info">
                    <span class="metric-label">En Progreso</span>
                    <span class="metric-value" id="metric-progress">0</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon" style="background: rgba(16, 185, 129, 0.2);">
                    <i class="fa-solid fa-check-circle" style="color: #10b981;"></i>
                </div>
                <div class="metric-info">
                    <span class="metric-label">Completadas</span>
                    <span class="metric-value" id="metric-completed">0</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-icon" style="background: rgba(197, 160, 89, 0.2);">
                    <i class="fa-solid fa-chart-line" style="color: #c5a059;"></i>
                </div>
                <div class="metric-info">
                    <span class="metric-label">Productividad</span>
                    <span class="metric-value" id="metric-productivity">0%</span>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-section">
            <div class="chart-container">
                <h3>Distribución por Prioridad</h3>
                <canvas id="priorityChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Progreso Semanal</h3>
                <canvas id="weeklyChart"></canvas>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar tareas...">
            </div>
            <div style="display: flex; gap: 1rem;">
                <button id="btn-export" class="btn-secondary">
                    <i class="fa-solid fa-download"></i> Exportar
                </button>
                <button id="btn-new-task" class="btn-primary">
                    <i class="fa-solid fa-plus"></i> Nueva Tarea
                </button>
            </div>
        </div>

        <div class="kanban-board">
            <!-- Column: Pendiente -->
            <div class="kanban-column" id="col-pendiente">
                <div class="column-header status-pendiente">
                    <h2>Pendiente</h2>
                    <span class="count">0</span>
                </div>
                <div class="task-list" id="list-pendiente">
                    <!-- Tasks will be injected here -->
                </div>
            </div>

            <!-- Column: En Progreso -->
            <div class="kanban-column" id="col-en_progreso">
                <div class="column-header status-progreso">
                    <h2>En Progreso</h2>
                    <span class="count">0</span>
                </div>
                <div class="task-list" id="list-en_progreso">
                    <!-- Tasks will be injected here -->
                </div>
            </div>

            <!-- Column: Completado -->
            <div class="kanban-column" id="col-completado">
                <div class="column-header status-completado">
                    <h2>Completado</h2>
                    <span class="count">0</span>
                </div>
                <div class="task-list" id="list-completado">
                    <!-- Tasks will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for New/Edit Task -->
    <div id="task-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Nueva Tarea</h2>
            <form id="task-form">
                <input type="hidden" id="task-id">

                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="input-title" required placeholder="Ej: Revisar presupuesto">
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="input-desc" rows="3" placeholder="Detalles de la tarea..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Prioridad</label>
                        <select id="input-priority">
                            <option value="baja">Baja</option>
                            <option value="media" selected>Media</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="input-status">
                            <option value="pendiente">Pendiente</option>
                            <option value="en_progreso">En Progreso</option>
                            <option value="completado">Completado</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Fecha Límite</label>
                    <input type="date" id="input-date">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary close-modal-btn">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>

</html>
